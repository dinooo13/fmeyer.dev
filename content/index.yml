title: Fabian Meyer
description: Staff Agentic Engineer at Cordes & Graefe KG focused on organisation-wide agentic engineering, spec-driven development, and engineering enablement.
hero:
  name: Fabian Meyer
  role: "Staff Agentic Engineer at Cordes\u00A0&\u00A0Graefe\u00A0KG"
  location: Bremen, Germany
  intro: I help companies make the move to agentic engineering. That means shaping how teams work with agents, building the tooling and workflows that make the change stick, and staying hands-on so the practices hold up in real delivery.
focus:
  title: Focus
  description: What I spend time on right now.
  items:
    - title: Agentic engineering transformation
      description: Moving companies to agentic engineering by defining the target way of working, guiding teams through the shift, and making sure adoption shows up as real delivery impact.
    - title: Agent-ready tooling and workflows
      description: Integrating agents into existing delivery tooling and building spec-driven development workflows that let engineers move from executing process to reviewing outcomes.
    - title: Enablement and coaching
      description: Workshops, pairing, and shared standards that help engineers build confidence with agents and grow the skills that matter when agents write most of the code.
    - title: Speaking and sharing
      description: Sharing what I learn about agentic engineering through talks and workshops, and bringing those sessions to more stages, teams, and events.
