title: "Onboarding Your Agent: How to Integrate Agentic Engineering into Enterprise Workflows"
summary: Six months after the first version, almost everything changed. With far more capable models, the bottleneck moved from writing code to verifying and reviewing it - this talk shows how we make agent work verifiable, keep merge requests reviewable, and sharpen the agent from every run.
event: code.talks 2026
location: Kinopolis HafenCity, Hamburg, Germany
topic: Agentic engineering in enterprise workflows
description: >-
  Coding agents are impressive, but in enterprise environments code was never
  the main bottleneck. The friction lives in the process: turning tickets into
  specs, running pipelines, opening merge requests, deploying, and debugging
  failures. We onboarded our agent like a new engineer. We gave it access to
  our tools, implemented our workflows as agent skills, and let it operate
  within our guardrails from ticket to verified result. Engineers review
  outcomes, not execute steps. This talk breaks down the four building blocks
  behind it: Specification, Implementation, Tools, and Verification. Together,
  they're what lets an agent own engineering work end to end - not just write
  code.
